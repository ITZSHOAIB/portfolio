<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="t d">
  <title id="t">The elephant and goldfish loop</title>
  <desc id="d">Your agent (the elephant) sends only the target to a fresh subagent (the goldfish). The goldfish reports what it saw, the elephant checks each claim against the source, and you decide what gets fixed.</desc>
  <style>
    .loop { animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    @media (prefers-reduced-motion: reduce) { .loop { animation: none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#71717a"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <rect x="10" y="50" width="190" height="100" rx="10" fill="#0a0a0a" stroke="#3f3f46"/>
    <text x="105" y="88" font-size="17" font-weight="600" fill="#fafafa">Elephant</text>
    <text x="105" y="110" font-size="13" fill="#a1a1aa">your agent</text>
    <text x="105" y="128" font-size="13" fill="#71717a">knows everything</text>

    <rect x="285" y="50" width="190" height="100" rx="10" fill="#0a0a0a" stroke="#3f3f46"/>
    <text x="380" y="88" font-size="17" font-weight="600" fill="#fafafa">Goldfish</text>
    <text x="380" y="110" font-size="13" fill="#a1a1aa">a fresh subagent</text>
    <text x="380" y="128" font-size="13" fill="#71717a">knows nothing</text>

    <rect x="560" y="50" width="190" height="100" rx="10" fill="#0a0a0a" stroke="#52525b"/>
    <text x="655" y="88" font-size="17" font-weight="600" fill="#fafafa">You</text>
    <text x="655" y="110" font-size="13" fill="#a1a1aa">decide what gets fixed</text>
    <text x="655" y="128" font-size="13" fill="#71717a">after claims are checked</text>

    <path d="M200 78H285" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="242" y="68" font-size="11" fill="#a1a1aa">only the target</text>
    <path d="M285 122H200" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="242" y="142" font-size="11" fill="#a1a1aa">what it saw</text>
    <path d="M200 100C230 175 530 175 560 100" fill="none" stroke="#71717a" stroke-width="1.5" class="loop" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <text x="380" y="186" font-size="11" fill="#a1a1aa">verified findings only</text>
  </g>
</svg>
