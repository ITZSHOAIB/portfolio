<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t d">
  <title id="t">The elephant and goldfish loop</title>
  <desc id="d">Your agent (the elephant) sends only the target to a fresh subagent (the goldfish). The goldfish reports what it saw, the elephant checks each claim against the source, and you decide what gets fixed.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#71717a"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <rect x="10" y="40" width="200" height="110" rx="10" fill="#0a0a0a" stroke="#3f3f46"/>
    <text x="110" y="82" font-size="21" font-weight="600" fill="#fafafa">Elephant</text>
    <text x="110" y="107" font-size="15" fill="#a1a1aa">your agent</text>
    <text x="110" y="128" font-size="15" fill="#71717a">knows everything</text>

    <rect x="280" y="40" width="200" height="110" rx="10" fill="#0a0a0a" stroke="#3f3f46"/>
    <text x="380" y="82" font-size="21" font-weight="600" fill="#fafafa">Goldfish</text>
    <text x="380" y="107" font-size="15" fill="#a1a1aa">a fresh subagent</text>
    <text x="380" y="128" font-size="15" fill="#71717a">knows nothing</text>

    <rect x="550" y="40" width="200" height="110" rx="10" fill="#0a0a0a" stroke="#52525b"/>
    <text x="650" y="82" font-size="21" font-weight="600" fill="#fafafa">You</text>
    <text x="650" y="107" font-size="15" fill="#a1a1aa">decide what gets fixed</text>
    <text x="650" y="128" font-size="15" fill="#71717a">after claims are checked</text>

    <path d="M210 70H280" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="245" y="30" font-size="13" fill="#a1a1aa">only the target</text>
    <path d="M280 120H210" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="245" y="176" font-size="13" fill="#a1a1aa">what it saw</text>
    <path d="M480 95H550" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M110 150C110 235 650 235 650 150" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <text x="380" y="240" font-size="13" fill="#a1a1aa">verified findings only</text>
  </g>
</svg>
